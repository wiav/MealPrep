<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Обучение — Meal Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
/* Специфичные стили для карточек статей */
.article-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
  margin-top: 36px;
}
.article-card {
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--frost);
  padding: 24px;
  cursor: pointer;
  transition: all .2s ease;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.article-card:hover {
  background: #fff;
  border-color: var(--brine);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.06);
}
.article-card-num {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--brine);
  letter-spacing: .12em;
  text-transform: uppercase;
  font-weight: 600;
}
.article-card h2 {
  font-family: var(--disp);
  font-size: 18px;
  margin: 0;
  line-height: 1.35;
  color: var(--steel);
}
.article-card-read {
  margin-top: auto;
  font-size: 13px;
  color: var(--slate);
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
}
.article-card:hover .article-card-read {
  color: var(--brine);
}

/* Модальное окно для чтения статьи */
.article-modal-backdrop {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(15, 23, 42, 0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 1000;
  display: none;
  opacity: 0;
  transition: opacity .25s ease;
  overflow-y: auto;
  padding: 24px 16px;
}
.article-modal-backdrop.show {
  display: block;
  opacity: 1;
}
.article-modal {
  background: #fff;
  max-width: 720px;
  margin: 20px auto;
  border-radius: 8px;
  border: 1px solid var(--line);
  box-shadow: 0 20px 48px rgba(0,0,0,0.12);
  position: relative;
  transform: translateY(16px);
  transition: transform .3s cubic-bezier(0.16, 1, 0.3, 1);
  overflow: hidden;
}
.article-modal-backdrop.show .article-modal {
  transform: translateY(0);
}
.article-modal-header {
  padding: 20px 28px;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  background: #fff;
  z-index: 2;
}
.article-modal-close {
  background: var(--frost);
  border: 1px solid var(--line);
  width: 34px; height: 34px;
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; color: var(--slate);
  transition: .15s;
  line-height: 1;
}
.article-modal-close:hover {
  background: var(--line); color: var(--steel);
}
.article-body {
  padding: 32px 36px 48px;
  font-size: 16px;
  line-height: 1.68;
  color: var(--steel);
}
.article-body h1 {
  font-family: var(--disp);
  font-size: 26px;
  margin-top: 0;
  margin-bottom: 24px;
  line-height: 1.25;
  color: var(--steel);
}
.article-body h2 {
  font-family: var(--disp);
  font-size: 20px;
  margin-top: 36px;
  margin-bottom: 14px;
  color: var(--steel);
  border-top: 1px solid var(--line);
  padding-top: 24px;
}
.article-body h3 {
  font-size: 16px;
  margin-top: 24px;
  margin-bottom: 10px;
  font-weight: 600;
  color: var(--steel);
}
.article-body p {
  margin-bottom: 16px;
}
.article-body ul {
  padding-left: 22px;
  margin-bottom: 18px;
}
.article-body li {
  margin-bottom: 8px;
}
.article-body strong {
  font-weight: 600;
  color: var(--steel);
}

@media (max-width: 640px) {
  .article-body {
    padding: 24px 20px 36px;
  }
  .article-modal-header {
    padding: 16px 20px;
  }
}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="mark" href="index.html">Заготовка <span>·</span> свой план</a>
    <nav class="nav">
      <a href="profile.html">Профиль</a>
      <a href="index.html">Рецепты</a>
      <a href="plan.html">Конструктор</a>
      <a href="calendar.html">Календарь</a>
      <a href="education.html" aria-current="page">Обучение</a>
    </nav>
  </div>
</header>

<main class="wrap" style="padding-top: 40px; padding-bottom: 80px;">
  <h1>Образовательные статьи</h1>
  <p class="lede" style="max-width:640px">Узнайте больше о принципах правильного питания, правилах составления тарелки и механизмах работы организма.</p>
  
  <div class="article-grid" id="articles-container"></div>
</main>

<!-- Modal Template -->
<div class="article-modal-backdrop" id="article-modal">
  <div class="article-modal">
    <div class="article-modal-header">
      <div class="article-card-num" id="article-modal-num"></div>
      <button class="article-modal-close" onclick="closeArticleModal()" aria-label="Закрыть">×</button>
    </div>
    <div class="article-body" id="article-modal-body"></div>
  </div>
</div>

<script src="data-articles.js"></script>
<script>
  function esc(s) {
    if (!s) return '';
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function renderArticles() {
    var container = document.getElementById('articles-container');
    if (!container) return;
    
    if (typeof ARTICLES === 'undefined' || !ARTICLES || !ARTICLES.length) {
      container.innerHTML = '<div class="empty" style="grid-column: 1 / -1; padding: 40px; text-align: center; border: 1px dashed var(--line); border-radius: 6px; color: var(--slate);">Статьи загружаются...</div>';
      return;
    }
    
    container.innerHTML = ARTICLES.map(function(art, index) {
      var num = String(index + 1).padStart(2, '0');
      return '<div class="article-card" onclick="openArticleModal(\'' + art.id + '\')">' +
               '<div class="article-card-num">Урок ' + num + '</div>' +
               '<h2>' + esc(art.title) + '</h2>' +
               '<div class="article-card-read">Читать статью →</div>' +
             '</div>';
    }).join('');
  }

  function openArticleModal(id) {
    if (typeof ARTICLES === 'undefined' || !ARTICLES) return;
    var art = ARTICLES.find(function(a) { return a.id === id; });
    if (!art) return;
    
    var index = ARTICLES.indexOf(art);
    var num = String(index + 1).padStart(2, '0');
    
    document.getElementById('article-modal-num').textContent = 'Урок ' + num;
    document.getElementById('article-modal-body').innerHTML = '<h1>' + esc(art.title) + '</h1>' + art.html;
    
    document.getElementById('article-modal').classList.add('show');
    document.body.style.overflow = 'hidden';
  }

  function closeArticleModal() {
    document.getElementById('article-modal').classList.remove('show');
    document.body.style.overflow = '';
  }

  document.getElementById('article-modal').addEventListener('pointerdown', function(e) {
    if (e.target === this) {
      closeArticleModal();
    }
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeArticleModal();
  });

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderArticles);
  } else {
    renderArticles();
  }
</script>
</body>
</html>
